<!doctype html><meta charset="utf-8"><title>Pip Lottie verification</title><script src="/node_modules/lottie-web/build/player/lottie.min.js"></script><pre id="results">Running</pre><div id="view" style="width:720px;height:720px"></div><script>
(async()=>{const result=[];for(const name of ['wave','dance','celebrate']){const animationData=await(await fetch('../lottie/'+name+'.json')).json();const a=lottie.loadAnimation({container:document.querySelector('#view'),renderer:'canvas',autoplay:false,loop:false,animationData});await new Promise((resolve,reject)=>{a.addEventListener('DOMLoaded',resolve);a.addEventListener('data_failed',reject)});const canvas=document.querySelector('canvas');a.goToAndStop(0,true);const start=canvas.toDataURL();const pixels=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;let visible=0;for(let i=3;i<pixels.length;i+=4)if(pixels[i]>0)visible++;a.goToAndStop(a.totalFrames-1,true);const end=canvas.toDataURL();a.goToAndStop(Math.floor(a.totalFrames*.35),true);const middle=canvas.toDataURL();result.push({name,totalFrames:a.totalFrames,visiblePixels:visible,startEqualsEnd:start===end,motionVisible:middle!==start});a.destroy();}document.querySelector('#results').textContent=JSON.stringify({complete:true,result});document.title='Verification complete';})().catch(e=>{document.querySelector('#results').textContent=String(e);document.title='Verification failed'});
</script>
