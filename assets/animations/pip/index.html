<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pip · Animation library</title><style>body{margin:24px auto;max-width:840px;padding:0 18px;background:#f0f2f0;color:#35444a;font:16px system-ui}h1{font-size:28px;margin-bottom:6px}p{line-height:1.5}video{display:block;width:100%;max-height:72vh;border-radius:20px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button,a{color:#345c66}button{border:1px solid #c0ceca;padding:12px 18px;border-radius:12px;background:#faf6ee;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#345c66;color:#faf6ee}a{margin-right:16px}small{color:#607276}</style><h1>Pip’s animation library</h1><p id="description">Wave → Dance → Celebrate · 12 seconds</p><nav aria-label="Choose animation"><button data-name="comparison" aria-pressed="true">Play all three</button><button data-name="wave" aria-pressed="false">👋 Wave · 3s</button><button data-name="dance" aria-pressed="false">💃 Dance · 6s</button><button data-name="celebrate" aria-pressed="false">🎉 Celebrate · 3s</button></nav><video id="video" src="previews/comparison.mp4" autoplay muted loop playsinline controls></video><p><a id="mp4" href="previews/comparison.mp4" download>Download MP4</a><a id="json" href="lottie/wave.json" download hidden>Editable Lottie JSON</a><a href="pip-library.zip" download>All assets & Lotties</a></p><small>One shared character, five reusable layers, matching idle poses. Animation review only. Native mobile playback still needs verification.</small><script>const video=document.querySelector('video'),labels={comparison:'Wave → Dance → Celebrate · 12 seconds',wave:'Wave · 3 seconds',dance:'Dance · 6 seconds',celebrate:'Celebrate · 3 seconds'};document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const n=b.dataset.name;video.src='previews/'+n+'.mp4';video.play().catch(()=>{});document.querySelector('#description').textContent=labels[n];document.querySelector('#mp4').href=video.src;document.querySelector('#json').hidden=n==='comparison';document.querySelector('#json').href='lottie/'+n+'.json';});</script></html>
