<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pip — Cavalry dance experiment</title><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#eee8df;color:#403a35;font:16px system-ui}main{width:min(92vw,760px);padding:24px 0}h1{font-size:24px;margin:0 0 8px}p{line-height:1.5}video{width:100%;display:block;border-radius:24px}small{display:block;margin-top:16px;line-height:1.5;color:#6a6058}button{border:1px solid #b4a89c;background:transparent;color:inherit;border-radius:10px;padding:10px 14px;cursor:pointer}</style><main><h1>Pip’s little study break</h1><p>Cavalry mesh animation • 4-second loop</p><video id="dance" src="pip-dance.mp4" autoplay loop muted playsinline controls></video><p><button id="slow">Half speed</button></p><small>Original Pip artwork, animated as a textured mesh. The laptop stays on his lap. This preview evaluates deformation and timing; it does not demonstrate a complete character rig or Lottie fidelity.</small></main><script>document.querySelector('#slow').onclick=function(){const v=document.querySelector('#dance');v.playbackRate=v.playbackRate===1?.5:1;this.textContent=v.playbackRate===1?'Half speed':'Normal speed'};</script></html>
